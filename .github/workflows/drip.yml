name: drip publish

# _queue/ に待機させた記事を1日1本だけ articles/ へ昇格させる。
# Zennのレートリミット（直近24時間の投稿数・予約中を含む）に触れずに
# 在庫を消化するための仕組み。詳細は scripts/drip.py のdocstring。

on:
  schedule:
    # 毎日 11:00 UTC = 20:00 JST 固定（2026-09-21 変更）。
    #
    # 以前は毎時実行で、間隔ガード（24時間15分）を満たした最初のtickに昇格していた。
    # その副作用で昇格時刻が毎日1時間ずつ後ろへずれ、2026-09-15 に真夜中を回った。
    # そこから「前の記事が前日18:00に公開された6〜12時間後に登録しようとする」形になり、
    # 8回中4回がZennの投稿数上限で弾かれて、公開が1日おきに飛ぶようになった。
    # 14時台〜23時台に昇格していた 09-04〜09-13 の10本は全部通っている。
    # 🚨 ただし 09-13 23:02 は前の公開から5時間でも通っており、この1件だけ説明がつかない。
    # Zennの判定ロジックは非公開なので、これは仮説にもとづく手当て。
    #
    # 20:00 JST なら、前の記事の公開（18:00）から26時間あいた状態で登録できる。
    # 公開は published_at（articles/ の最後の1本の翌日18:00）で決まるので、
    # 昇格を固定しても読者から見える公開時刻は動かない。
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ファイルを変更せず動作だけ確認する'
        type: boolean
        default: false
      publish_time:
        description: '公開時刻（JST・HH:MM）'
        type: string
        default: '18:00'
      force:
        description: '昇格間隔のガードを無視する（手動リカバリ用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drip-publish
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1本昇格させる
        id: drip
        run: |
          python3 scripts/drip.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            --publish-time "${{ inputs.publish_time || '18:00' }}" \
            | tee drip.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: push する
        if: ${{ !inputs.dry_run }}
        run: |
          # 対象は articles / _queue だけ。全体を見ると drip.log（tee で作る
          # untracked ファイル）を拾ってしまい、昇格なしのtickでも
          # 早期exitに入らず git commit が「nothing to commit」で落ちる
          if [ -z "$(git status --porcelain articles _queue)" ]; then
            echo "昇格なし。pushしません。"
            exit 0
          fi
          slug=$(git status --porcelain articles | awk '{print $NF}' | xargs -r -n1 basename | sed 's/\.md$//' | head -1)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles _queue
          git commit -m "publish: ${slug:-記事を1本昇格} (drip)"
          git push

      - name: 実行結果をまとめる
        if: always()
        run: |
          {
            echo '### zenn drip'
            echo ''
            echo '```'
            cat drip.log 2>/dev/null || echo '(ログなし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 公開の取りこぼしがあれば失敗させる
        if: ${{ steps.drip.outputs.exit != '0' }}
        run: |
          echo "::error::公開予定日を過ぎたのに公開されていない記事があります。https://zenn.dev/dashboard/deploys を確認してください。"
          exit 1
