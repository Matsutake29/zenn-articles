name: drip publish

# _queue/ に待機させた記事を1日1本だけ articles/ へ昇格させる。
# Zennのレートリミット（直近24時間の投稿数・予約中を含む）に触れずに
# 在庫を消化するための仕組み。詳細は scripts/drip.py のdocstring。

on:
  schedule:
    # 毎時。実際に昇格するのは drip.py の間隔ガード（前回から24時間15分）を
    # 満たした最初のtickだけなので、1日に出るのは1本のまま。
    #
    # 昇格時刻は毎日15分以上うしろへずれる（間隔ガードの副作用）。以前は
    # 09:00-12:00 JST の3tickに絞っていたが、ずれが末尾を越えた 2026-08-03 に
    # 1日飛び、X告知だけが先に出て404を晒した。24時間ぶん開けておけば、
    # 条件を満たした最初のtickで必ず昇格するので飛ばない。
    #
    # 公開は published_at（articles/ の最後の1本の翌日18:00）で決まるため、
    # 昇格が何時になっても読者から見える公開時刻は動かない。
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ファイルを変更せず動作だけ確認する'
        type: boolean
        default: false
      publish_time:
        description: '公開時刻（JST・HH:MM）'
        type: string
        default: '18:00'
      force:
        description: '昇格間隔のガードを無視する（手動リカバリ用）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drip-publish
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1本昇格させる
        id: drip
        run: |
          python3 scripts/drip.py \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            --publish-time "${{ inputs.publish_time || '18:00' }}" \
            | tee drip.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: push する
        if: ${{ !inputs.dry_run }}
        run: |
          # 対象は articles / _queue だけ。全体を見ると drip.log（tee で作る
          # untracked ファイル）を拾ってしまい、昇格なしのtickでも
          # 早期exitに入らず git commit が「nothing to commit」で落ちる
          if [ -z "$(git status --porcelain articles _queue)" ]; then
            echo "昇格なし。pushしません。"
            exit 0
          fi
          slug=$(git status --porcelain articles | awk '{print $NF}' | xargs -r -n1 basename | sed 's/\.md$//' | head -1)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles _queue
          git commit -m "publish: ${slug:-記事を1本昇格} (drip)"
          git push

      - name: 実行結果をまとめる
        if: always()
        run: |
          {
            echo '### zenn drip'
            echo ''
            echo '```'
            cat drip.log 2>/dev/null || echo '(ログなし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 公開の取りこぼしがあれば失敗させる
        if: ${{ steps.drip.outputs.exit != '0' }}
        run: |
          echo "::error::公開予定日を過ぎたのに公開されていない記事があります。https://zenn.dev/dashboard/deploys を確認してください。"
          exit 1
